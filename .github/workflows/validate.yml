name: Validate Pipeline Artifacts

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile pipeline scripts
        run: |
          python -m py_compile \
            analytics_case_study/01_data_cleaning.py \
            analytics_case_study/02_data_integration.py \
            analytics_case_study/03_analysis.py \
            analytics_case_study/03b_attribution.py \
            analytics_case_study/03c_advanced_analytics.py \
            analytics_case_study/04_html_dashboard.py \
            analytics_case_study/05_presentation.py \
            analytics_case_study/06_validate_metrics.py \
            run_pipeline.py

      - name: Check pipeline runner
        run: python run_pipeline.py --dry-run

      - name: Validate generated artifacts
        run: python analytics_case_study/06_validate_metrics.py
