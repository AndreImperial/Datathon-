name: Validate and release exact artifact
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - name: Regenerate every source-backed analysis and build
        run: python run_pipeline.py
      - name: Required regression checks
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          npm test
          python analytics_case_study/06_validate_metrics.py
      - name: Upload successful bytes
        uses: actions/upload-artifact@v4
        with:
          name: validated-public
          path: public/
          include-hidden-files: true
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
